name: jobhunter

services:
  postgres:
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://jobhunter:${POSTGRES_PASSWORD}@postgres:5432/jobhunter
      JOBLISTING_DIR: /data/joblisting
      CV_DIR: /data/cv
      COVER_LETTER_DIR: /data/cover-letter
    volumes:
      # Long syntax with create_host_path: false, so a missing job folder fails loudly
      # instead of Compose silently creating an empty one.
      - type: bind
        source: ${JOBLISTING_DIR:-./Joblisting}
        target: /data/joblisting
        read_only: true
        bind:
          create_host_path: false
      # Read-write: the worker is the only code that uploads to and deletes from these folders.
      - type: bind
        source: ${CV_DIR:-./PersonalDetailsCV}
        target: /data/cv
        bind:
          create_host_path: false
      - type: bind
        source: ${COVER_LETTER_DIR:-./PersonalDetailsCoverLetter}
        target: /data/cover-letter
        bind:
          create_host_path: false
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    restart: unless-stopped
    image: n8nio/n8n:2.46.6
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      ANTHROPIC_BASE_URL: https://api.anthropic.com
      EXTRACT_MODEL: ${EXTRACT_MODEL:-claude-haiku-5-5}
      WORKER_URL: http://worker:3001
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: Australia/Sydney
      JOBHUNTER_SCHEDULE_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      - worker

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - n8n

volumes:
  pg_data:
  n8n_data:
