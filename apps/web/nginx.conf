server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://n8n:5678/webhook/api/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    # The page and the API share this origin, so no CORS is needed here. Drop any CORS
    # headers n8n sends so other sites cannot read the API through the proxy.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Private-Network;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
