# Any Host name other than the ones the app is opened by gets no answer at all (444 closes the
# connection). This stops DNS rebinding: a hostile site whose name points at 127.0.0.1 would otherwise
# count as "same origin" here and could read the API (your CV and letters) or start paid generations.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://n8n:5678/webhook/api/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    # Document uploads: the app allows 5 MB, plus multipart overhead.
    client_max_body_size 6m;
    # The page and the API share this origin, so no CORS is needed here. Drop any CORS
    # headers n8n sends so other sites cannot read the API through the proxy.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Private-Network;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
